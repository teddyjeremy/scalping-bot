name: Stop active collector for dataset reset

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stop-collector-for-reset.yml"

permissions:
  actions: write

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the old collector run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/45373383596/cancel"
          echo "Cancellation requested for collector run 45373383596."
