name: Reset collected Solana dataset

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reset-collected-data.yml"

permissions:
  actions: read
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Wait for the active collector to finish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RUN_ID=45373383596
          for attempt in $(seq 1 720); do
            STATUS=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID" | python -c "import json,sys; print(json.load(sys.stdin).get('status','unknown'))")
            echo "Collector run $RUN_ID status: $STATUS"
            if [ "$STATUS" = "completed" ] || [ "$STATUS" = "unknown" ]; then
              break
            fi
            sleep 30
          done
          if [ "$STATUS" != "completed" ] && [ "$STATUS" != "unknown" ]; then
            echo "::error::Timed out waiting for the active collector; dataset was not touched."
            exit 1
          fi
      - name: Delete all collected dataset files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          python -m pip install --quiet huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo_id = "ndeda/solana-scalping-data"
          for folder in ("raw", "state", "quality"):
              try:
                  api.delete_folder(
                      repo_id=repo_id,
                      repo_type="dataset",
                      path_in_repo=folder,
                      commit_message="Clear collected Solana research data for clean restart",
                  )
                  print(f"DELETED {folder}/")
              except Exception as exc:
                  message = str(exc)
                  if "404" in message or "not found" in message.lower():
                      print(f"ALREADY EMPTY {folder}/")
                  else:
                      raise
          print("Dataset data reset complete.")
          PY
      - name: Verify dataset root is clean
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          entries = api.list_repo_tree("ndeda/solana-scalping-data", repo_type="dataset", recursive=True)
          paths = [entry.path for entry in entries]
          unexpected = [p for p in paths if p != ".gitattributes"]
          print("Remaining files:", paths)
          if unexpected:
              raise SystemExit("Unexpected dataset files remain: " + ", ".join(unexpected[:30]))
          print("VERIFIED: no collected data files remain.")
          PY
