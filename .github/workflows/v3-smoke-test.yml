name: Solana dataset v3 publisher smoke test

on:
  push:
    paths:
      - ".github/workflows/v3-smoke-test.yml"

permissions:
  contents: read

jobs:
  smoke-test:
    if: github.event.head_commit.message == 'Run v3 publisher integration smoke test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify per-coin save and resume
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DATA_DIR: ./historical-data
        run: |
          python -m pip install --upgrade huggingface_hub
          python -m py_compile scripts/hf-dataset-v3-sync.py scripts/test-hf-dataset-v3.py
          python scripts/test-hf-dataset-v3.py
