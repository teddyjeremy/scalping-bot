name: Solana dataset v3 publisher smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync v3 collection config and verify HF readback
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install --upgrade huggingface_hub
          python -m py_compile scripts/publish-v3-config.py
          python scripts/publish-v3-config.py
      - name: Verify per-coin save and resume
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DATA_DIR: ./historical-data
        run: |
          python -m py_compile scripts/hf-dataset-v3-sync.py scripts/test-hf-dataset-v3.py
          python scripts/test-hf-dataset-v3.py
