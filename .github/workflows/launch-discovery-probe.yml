name: Launch discovery endpoint probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe public launch discovery endpoints
        run: node scripts/launch-discovery-probe.mjs
      - name: Preserve report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-discovery-endpoint-probe
          path: launch-discovery-probe-output/
          if-no-files-found: warn
          retention-days: 14
