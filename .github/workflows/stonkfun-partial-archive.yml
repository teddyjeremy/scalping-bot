name: Solana historical archive - free replay source

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - '.github/workflows/stonkfun-partial-archive.yml'
      - 'scripts/shrine-replay-archive.py'
      - 'scripts/hf-dataset-v3-sync.py'
  workflow_dispatch:

concurrency:
  group: historical-solana-archive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HISTORY_START: "2026-11-01T00:00:00Z"
      HISTORY_END: "2026-11-02T00:00:00Z"
      DATA_DIR: ./historical-data
      REPLAY_MAX_HOURS_PER_RUN: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: historical-data
          key: solana-free-replay-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate Hugging Face secret
        shell: bash
        run: |
          test -n "$HF_TOKEN" || { echo "::error::Missing HF_TOKEN"; exit 1; }
      - name: Install dependencies
        run: npm install
      - name: Install replay and Hugging Face dependencies
        run: python -m pip install --upgrade huggingface_hub requests zstandard
      - name: Typecheck, test, and compile replay collector
        run: |
          npm run typecheck
          npm test
          python -m py_compile scripts/shrine-replay-archive.py scripts/hf-dataset-v3-sync.py
      - name: Restore existing dataset and resumable checkpoint
        run: python scripts/hf-dataset-v3-sync.py restore
      - name: Verify public replay archive covers the requested hours
        run: |
          python - <<'PY'
          import requests
          base = "https://replay.shrine.trade/pump"
          data = requests.get(base + "/index.json", timeout=30)
          data.raise_for_status()
          hours = set(data.json().get("hours", []))
          required = [f"2026/11/01/{h:02d}" for h in range(24)] + ["2026/11/02/00"]
          missing = [hour for hour in required if hour not in hours]
          print(f"Required replay hours: {len(required)}; available: {len(required)-len(missing)}")
          if missing:
              raise SystemExit(f"Replay archive is missing required hours: {missing[:10]}")
          print("REPLAY_SOURCE_COVERAGE_VERIFIED")
          PY
      - name: Verify Hugging Face write/read/delete access
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/hf-dataset-v3-sync.py write-test
      - name: Collect November 1 launches and first ten minutes from free hourly replay
        timeout-minutes: 50
        run: python scripts/shrine-replay-archive.py
      - name: Flush checkpoint and any staged dataset files
        if: success()
        run: python scripts/hf-dataset-v3-sync.py publish-batch
      - name: Preserve run output as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solana-free-replay-${{ github.run_id }}
          path: historical-data/
          if-no-files-found: warn
          retention-days: 30
