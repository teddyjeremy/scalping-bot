name: Collector typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Typecheck
        id: typecheck
        run: npm run typecheck
      - name: Unit tests
        id: tests
        run: npm test
      - name: Publish preflight verification
        if: github.event_name == 'push'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ndeda/solana-scalping-data
          VERIFICATION_STAGE: preflight
          JOB_STATUS: ${{ job.status }}
          TYPECHECK_STATUS: ${{ steps.typecheck.outcome }}
          UNIT_TEST_STATUS: ${{ steps.tests.outcome }}
        run: node scripts/publish-ci-status.mjs
