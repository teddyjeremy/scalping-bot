name: Collector typecheck

on:
  push:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Typecheck
        id: typecheck
        run: npm run typecheck
      - name: Typecheck historical collector
        run: npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --strict --esModuleInterop --skipLibCheck scripts/historical-archive.ts
      - name: Validate v3 publisher syntax
        run: |
          python -m pip install --upgrade huggingface_hub
          python -m py_compile scripts/hf-dataset-v3-sync.py
      - name: Unit tests
        id: tests
        run: npm test
