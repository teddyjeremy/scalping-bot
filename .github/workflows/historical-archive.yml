name: Historical Solana research archive

on:
  push:
    branches: [main]
    paths:
      - ".historical-archive-start"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      start_date:
        description: "UTC start date (YYYY-MM-DD)"
        required: true
        default: "2026-11-01"
        type: string
      end_date:
        description: "UTC end date, exclusive (YYYY-MM-DD)"
        required: true
        default: "2026-11-24"
        type: string
      max_pages:
        description: "Maximum 1000-transaction pages per address per run"
        required: true
        default: "20"
        type: string

concurrency:
  group: historical-solana-archive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      HELIUS_API_KEY_1: ${{ secrets.HELIUS_API_KEY_1 }}
      HELIUS_API_KEY_2: ${{ secrets.HELIUS_API_KEY_2 }}
      HELIUS_API_KEY_3: ${{ secrets.HELIUS_API_KEY_3 }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HISTORY_START: "${{ inputs.start_date || '2026-11-01' }}T00:00:00Z"
      HISTORY_END: "${{ inputs.end_date || '2026-11-24' }}T00:00:00Z"
      HISTORY_MAX_PAGES_PER_RUN: ${{ inputs.max_pages || '20' }}
      DATA_DIR: ./historical-data
      HELIUS_RPC_MIN_INTERVAL_MS: "2000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: historical-data
          key: historical-archive-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            historical-archive-
      - name: Validate secrets and date range
        shell: bash
        run: |
          test -n "$HELIUS_API_KEY_1" || { echo "::error::Missing HELIUS_API_KEY_1"; exit 1; }
          test -n "$HELIUS_API_KEY_2" || { echo "::error::Missing HELIUS_API_KEY_2"; exit 1; }
          test -n "$HELIUS_API_KEY_3" || { echo "::error::Missing HELIUS_API_KEY_3"; exit 1; }
          test -n "$HF_TOKEN" || { echo "::error::Missing HF_TOKEN"; exit 1; }
          python - <<'PY'
          import os
          from datetime import date
          start = date.fromisoformat(os.environ["HISTORY_START"][:10])
          end = date.fromisoformat(os.environ["HISTORY_END"][:10])
          if start >= end:
              raise SystemExit("HISTORY_START must be earlier than HISTORY_END")
          PY
      - name: Install dependencies
        run: npm install
      - name: Install Hugging Face client
        run: python -m pip install --upgrade huggingface_hub
      - name: Restore previous archive and checkpoint from Hugging Face
        run: python scripts/hf-dataset-sync.py restore
      - name: Verify Hugging Face dataset write access and clean up test file
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/hf-dataset-sync.py write-test
      - name: Typecheck application and historical scanner
        run: |
          npm run typecheck
          npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --strict --esModuleInterop --skipLibCheck scripts/historical-archive.ts
      - name: Run unit tests
        run: npm test
      - name: Scan historical launches and first ten minutes of trades
        run: npm run historical:archive
      - name: Upload resumable archive to Hugging Face dataset
        if: always()
        run: |
          python -m pip install --upgrade huggingface_hub
          python scripts/hf-dataset-sync.py upload
      - name: Preserve run output as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-archive-${{ github.run_id }}
          path: historical-data/
          if-no-files-found: warn
          retention-days: 30
