name: Solana research readiness validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HELIUS_API_KEY_1: ${{ secrets.HELIUS_API_KEY_1 }}
      HELIUS_API_KEY_2: ${{ secrets.HELIUS_API_KEY_2 }}
      HELIUS_API_KEY_3: ${{ secrets.HELIUS_API_KEY_3 }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      DATA_DIR: ./historical-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Node dependencies
        run: npm install
      - name: Typecheck application and historical collector
        run: |
          npm run typecheck
          npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --strict --esModuleInterop --skipLibCheck scripts/historical-archive.ts
      - name: Run unit tests
        run: npm test
      - name: Verify standard Free-tier Helius RPC history, pagination and hydration
        run: node scripts/helius-preflight.mjs
      - name: Verify Hugging Face config publishing and per-coin persistence
        run: |
          python -m pip install --upgrade huggingface_hub
          python -m py_compile scripts/hf-dataset-v3-sync.py scripts/publish-v3-config.py scripts/test-hf-dataset-v3.py
          python scripts/publish-v3-config.py
          python scripts/test-hf-dataset-v3.py
